<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4fbfc" />
    <title>nuvō — custom software and products</title>
    <meta
      name="description"
      content="nuvō builds web and native products for clients, runs the cloud work that keeps them up, and makes its own apps the same way."
    />
    <link rel="canonical" href="https://nuvo-software.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nuvo-software.com/" />
    <meta property="og:title" content="nuvō — custom software and products" />
    <meta
      property="og:description"
      content="Custom software and DevOps for other teams, and apps we ship ourselves."
    />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="nuvō — custom software and products" />
    <meta
      name="twitter:description"
      content="Custom software and DevOps for other teams, and apps we ship ourselves."
    />
    <script>
      (function () {
        var theme = 'light'
        try {
          var stored = localStorage.getItem('nuvo-theme')
          if (stored === 'light' || stored === 'dark') {
            theme = stored
          } else if (matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark'
          }
        } catch (e) {
          /* private mode */
        }
        document.documentElement.dataset.theme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#003c3e' : '#f4fbfc')
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
